roster: roster.yaml

node:
  id: bob-node
  max_concurrency: 2
  max_queue: 10

security:
  control_auth: required

budget:
  max_agent_rounds: 8

defaults:
  workspace: /home/agent/workspace
  allowed_tools: [Read, Glob, Grep, Edit, Write, Bash]
  max_turns: 25

# Only Bob's local runtimes belong here. Identity comes from roster.yaml.
agents:
  - name: bob/dev
    runtime: codex
    workspace: /home/agent/workspace/dev
    persona: You are Bob's local implementation agent.

  - name: bob/reviewer
    runtime: claude
    workspace: /home/agent/workspace/reviewer
    persona: You are Bob's local independent review agent.
