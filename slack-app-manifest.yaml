# https://api.slack.com/apps -> Create New App -> From a manifest — paste this file as-is
display_information:
  name: Claude Code Bot
  description: ローカル Claude Code を Slack に接続
  background_color: "#d97757"
features:
  app_home:
    # Enable DM entry: make Messages Tab available and allow messages from users
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: claude-code
    always_online: true
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - chat:write
      - im:history
      - im:read
      - im:write
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.im
  interactivity:
    is_enabled: false
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
